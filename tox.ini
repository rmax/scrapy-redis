[tox]
requires =
    tox>=4
envlist =
    docs
    security
    flake8
    py{310,311,312,313}-scrapy{213,214,215,216,218}-redis{50,64,72,73,74,80,81}
minversion = 3.0.0

[base]
deps =
    -r requirements-tests.txt
    -r requirements.txt

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
deps =
    {[base]deps}
    scrapy213: scrapy~=2.13.0
    scrapy214: scrapy~=2.14.0
    scrapy215: scrapy~=2.15.0
    scrapy216: scrapy~=2.16.0
    scrapy218: scrapy~=2.18.0
    redis50: redis~=5.0.0
    redis64: redis~=6.4.0
    redis72: redis~=7.2.0
    reids73: redis~=7.3.0
    redis74: redis~=7.4.0
    redis80: redis~=8.0.0
    redis81: redis~=8.1.0
passenv =
    REDIS_HOST
    REDIS_PORT
commands =
    python -m pytest # --cov-report term --cov=scrapy_redis

[testenv:flake8]
basepython =
    python3.12
deps =
    {[base]deps}
commands =
    flake8 --ignore=W503,E265,E731 docs src tests

[testenv:security]
basepython =
    python3.12
deps =
    bandit~=1.7.3
commands =
    bandit -r -c .bandit.yml src/ tests/

[testenv:pytest]
basepython =
    python3.12
deps =
    {[testenv]deps}
passenv =
    REDIS_HOST
    REDIS_PORT
commands =
    python -m pytest --cov-report term --cov=scrapy_redis

[testenv:build]
basepython =
    python3.12
deps =
    {[base]deps}
    build
commands =
    python -m build

[testenv:docs]
basepython =
    python3.12
deps =
    {[base]deps}
    -r docs/requirements.txt
allowlist_externals =
    make
commands =
    # Same command as readthedocs
    make -C docs html SPHINXOPTS="-T -W --keep-going -D language=en"
